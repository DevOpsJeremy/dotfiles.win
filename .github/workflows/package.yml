on:
  push:

jobs:
  pack:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
        working-directory: ./setup
    steps:
      - uses: actions/checkout@v6
      - name: Install choco
        run: Invoke-RestMethod "https://community.chocolatey.org/install.ps1" | Invoke-Expression
      - name: Choco pack
        run: |
          Get-ChildItem -Path ./packages -Filter *.nuspec -Recurse -File |
            ForEach-Object {
              choco pack $_.FullName
            }
      - name: Choco install
        run: |
          Get-ChildItem *.nupkg |
            ForEach-Object {
              $name = $_.Name -replace '(.+)\.\d+\.\d+\.\d+(-[^.]+)?\.nupkg', '$1'
              choco install $name --source .
            }